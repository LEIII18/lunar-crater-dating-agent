[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crater-dating-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "craterstats==3.6.7",
  "openai==3.2.0",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "plotly>=6,<7",
  "pyproj>=3.6,<4",
  "pyshp>=2.3,<4",
  "PyYAML>=6.0,<7",
  "rasterio>=1.4,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: runs the real Craterstats engine against SID9 data"]

[tool.setuptools.packages.find]
include = ["crater_dating_agent*"]

[tool.setuptools.package-data]
crater_dating_agent = ["configs/*.yaml", "prompts/*.txt", "prompts/examples/SID55/*.json", "prompts/examples/SID55/*.png"]
